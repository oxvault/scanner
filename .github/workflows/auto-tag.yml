name: Auto Tag

# Tags every merge to main, then release.yml (triggered by the tag push)
# cuts a real GitHub Release + GoReleaser build + Homebrew formula update.
#
# Bump rule (Conventional Commits on the merge commit's subject line):
#   type!: or "BREAKING CHANGE" in the body -> major
#   feat: / feat(scope):                    -> minor
#   anything else                           -> patch (default)
#
# docs:/test:/ci: commits are skipped entirely — no tag, no release. This
# mirrors the changelog exclude filters in .goreleaser.yaml.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'test:') &&
      !startsWith(github.event.head_commit.message, 'ci:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          set -e

          LATEST_TAG="$(git tag --list 'v*.*.*' | sort -V | tail -1)"
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"
          VERSION="${LATEST_TAG#v}"

          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          PATCH="$(echo "$VERSION" | cut -d. -f3)"

          MSG="$(git log -1 --pretty=%B)"

          if echo "$MSG" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' || echo "$MSG" | grep -q 'BREAKING CHANGE'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qE '^feat(\([^)]*\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Latest: $LATEST_TAG -> New: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
